script = "Arab"
direction = "rtl"
shaping = "engine-native-complex"
reference_glyph = "م"
emphasis = "bold"
smallcaps = "unchanged"

[tables]
math = "ltr"
text = "rtl"
proof_cells = "ltr"
proof_selector = "DisplayProof"

[proofs]
qed = "source-square"
qed_position = "left"
qed_explanation_front_matter = true

[citations]
direction = "ltr"
single_link = true
commands = ["citep", "citet", "citealt", "citeauthor", "citeyear", "citeyearpar"]
