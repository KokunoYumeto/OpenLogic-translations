rationale = "A line of the published Marathi SLC (PDF page 5) uses OLMarathiSerif-Regular for x and क. Resetting those same font objects, glyph IDs and sizes with space between them gives an ink-height ratio of 0.85526. The limits allow two measurements' raster uncertainty."
