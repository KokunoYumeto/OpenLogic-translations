[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "olpkit"
version = "0.1.0"
description = "Pinned source and publication tools for Open Logic editions"
requires-python = ">=3.11"
dependencies = ["jsonschema==4.26.0"]

[project.optional-dependencies]
pdf = ["pypdf==6.12.2", "pdfplumber==0.11.10", "PyMuPDF==1.27.2.3", "fonttools==4.63.0", "Pillow==12.2.0"]
epub = ["lxml==6.1.1", "fonttools==4.63.0"]
test = ["reportlab==5.0.0"]

[project.scripts]
olpkit = "olpkit.cli:main"

[tool.setuptools]
packages = ["olpkit"]
